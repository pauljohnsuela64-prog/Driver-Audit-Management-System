name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  sqlite-tests:
    name: Python 3.14 / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: '1'
      DATABASE_URL: ''
      DAMS_PROD_RUNTIME_URL: ''
      DAMS_TEST_DATABASE_URL: ''
      DAMS_TEST_RUNTIME_URL: ''
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency integrity
        run: python -m pip check
      - name: Verify Python syntax
        run: python -m compileall -q backend scripts migrations tests
      - name: Run default tests (live MySQL checks explicitly skipped)
        run: python -m pytest -q -rs
