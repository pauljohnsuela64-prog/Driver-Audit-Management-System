name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  sqlite-tests:
    name: Python 3.14 / SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: '1'
      DATABASE_URL: ''
      DAMS_PROD_RUNTIME_URL: ''
      DAMS_TEST_DATABASE_URL: ''
      DAMS_TEST_RUNTIME_URL: ''
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency integrity
        run: python -m pip check
      - name: Verify Python syntax
        run: python -m compileall -q backend desktop scripts migrations tests
      - name: Run default tests (live MySQL checks explicitly skipped)
        run: python -m pytest -q -rs

  mysql-tests:
    name: Python 3.14 / disposable MySQL 8.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON_DOTENV_DISABLED: '1'
      DATABASE_URL: ''
      DAMS_PROD_RUNTIME_URL: ''
      DAMS_TEST_ACCOUNT_HOST: '%'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency integrity
        run: python -m pip check
      - name: Provision disposable MySQL and restricted test accounts
        run: python -m scripts.ci_mysql
      - name: Run complete MySQL integration suite
        run: python -m pytest --mysql -q -rs
      - name: Remove disposable MySQL
        if: always()
        run: docker rm --force dams-ci-mysql >/dev/null 2>&1 || true

  desktop-tests:
    name: Python 3.14 / Windows desktop
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: '1'
      DATABASE_URL: ''
      DAMS_PROD_RUNTIME_URL: ''
      DAMS_TEST_DATABASE_URL: ''
      DAMS_TEST_RUNTIME_URL: ''
      DAMS_DESKTOP_GUI_TESTS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - name: Install backend test and separate desktop dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Check dependency integrity
        run: python -m pip check
      - name: Verify desktop syntax
        run: python -m compileall -q desktop tests/desktop
      - name: Run isolated desktop contracts and native Tk checks
        run: python -m pytest tests/desktop -q -rs
